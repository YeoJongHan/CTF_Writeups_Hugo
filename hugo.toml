baseURL = "https://ctf.jonghan.xyz/"
title = "CTF Writeups"
theme = "hugo-theme-stack"
locale = "en-us"
defaultContentLanguage = "en"
enableEmoji = true
hasCJKLanguage = false
mainSections = ["posts"]
rssFullContent = true

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    lineNumbersInTable = false
    noClasses = false
    style = "github"
    tabWidth = 2

[params]
  description = "CTF writeups by Jong Han"
  keywords = ["CTF", "writeups", "cybersecurity", "pwn", "reverse engineering", "cryptography"]
  mainSections = ["posts"]
  rssFullContent = true
  favicon = "/favicon.svg"

  [params.footer]
    since = 2022
    customText = ""

  [params.dateFormat]
    published = ":date_full"
    lastUpdated = ":date_full"

  [params.sidebar]
    compact = false
    emoji = ""
    subtitle = "Capture the Flag writeups and challenge notes."
    avatar = "/images/avatar.svg"

  [params.article]
    headingAnchor = true
    math = true
    toc = true
    readingTime = false

    [params.article.list]
      showTags = true

    [params.article.license]
      enabled = false

    [params.article.mermaid]
      look = "classic"
      lightTheme = "default"
      darkTheme = "dark"
      securityLevel = "strict"
      htmlLabels = true
      transparentBackground = false

  [params.widgets]
    homepage = [
      { type = "search" },
      { type = "archives", params = { limit = 5 } },
      { type = "categories", params = { limit = 10 } },
      { type = "tag-cloud", params = { limit = 20 } },
    ]
    page = [
      { type = "toc" },
    ]

  [params.colorScheme]
    toggle = true
    default = "dark"

  [params.comments]
    enabled = false
    provider = ""

  [params.cookies]
    enabled = false
    showSettings = true

  [params.imageProcessing]
    autoOrient = false

    [params.imageProcessing.content]
      enabled = true
      widths = [800, 1600, 2400]

    [params.imageProcessing.thumbnail]
      enabled = true

[menus]
  [[menus.main]]
    identifier = "home"
    name = "Home"
    pageRef = "/"
    weight = 1
    [menus.main.params]
      icon = "home"

  [[menus.main]]
    identifier = "writeups"
    name = "Writeups"
    pageRef = "/posts"
    weight = 10
    [menus.main.params]
      icon = "archives"

  [[menus.main]]
    identifier = "archives"
    name = "Archives"
    pageRef = "/archives"
    weight = 20
    [menus.main.params]
      icon = "archives"

  [[menus.main]]
    identifier = "categories"
    name = "Categories"
    pageRef = "/categories"
    weight = 30
    [menus.main.params]
      icon = "categories"

  [[menus.main]]
    identifier = "tags"
    name = "Tags"
    pageRef = "/tags"
    weight = 40
    [menus.main.params]
      icon = "tag"

  [[menus.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/yeojonghan"
    weight = 10
    [menus.social.params]
      icon = "brand-github"
      newTab = true
  [[menus.social]]
    identifier = "linkedin"
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/yeo-jong-han-7010311b2/"
    weight = 20
    [menus.social.params]
      icon = "brand-linkedin"
      newTab = true
